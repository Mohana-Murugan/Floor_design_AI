<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floor incident marks</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="titles">
        <p class="kicker">Floor review</p>
        <h1>Mark where an incident is likely</h1>
      </div>
      <p class="lede">Upload a plan and it becomes a drawing you can edit. A kitchen with no ventilation is pinned as a fire risk, and the fix is to provide ventilation.</p>
      <div class="actions">
        <label class="button primary">
          Upload plan
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,.svg,image/svg+xml" hidden>
        </label>
        <button id="sample" type="button">This sample</button>
        <button id="read-drawing" type="button" class="button">Read drawing</button>
        <button id="export" type="button">Export SVG</button>
      </div>
    </header>
    <div class="workspace">
      <aside class="panel rooms" id="rooms" aria-label="Rooms"></aside>
      <section class="stage">
        <div class="toolbar">
          <button type="button" data-mode="select" class="active">Select</button>
          <button type="button" data-mode="add-room">Add room</button>
          <button type="button" data-mode="add-mark">Add mark</button>
          <span class="spacer"></span>
          <label class="check"><input id="show-drawing" type="checkbox" checked> Drawing</label>
          <label class="check"><input id="show-photo" type="checkbox"> Photo</label>
          <label class="check"><input id="show-rooms" type="checkbox" checked> Rooms</label>
          <button id="fit" type="button">Fit</button>
        </div>
        <div class="canvas-wrap" id="wrap">
          <svg id="plan" role="img" aria-label="Floor plan"></svg>
          <p class="hint" id="hint"></p>
        </div>
      </section>
      <aside class="panel findings" id="findings" aria-label="Likely incidents"></aside>
    </div>
  </div>
  <div class="drop" id="drop" hidden>Drop the plan to convert it</div>
  <script src="/static/app.js"></script>
</body>
</html>
